<title>Alabama Ballot Guide 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: one calm 1080px column. Slim opaque header (brand, sections, My picks), a short hero
   with key dates and the absentee callout, an issue filter with a live result line, then each
   race as a section with candidates side by side. Sizes in rem so phone text settings apply. */
:root {
  --bg: #ffffff;
  --surface: #f3f6f5;
  --raised: #ffffff;
  --line: #dfe6e3;
  --line-strong: #c9d3cf;
  --control-line: #858f8a;
  --fg: #111715;
  --muted: #56625d;
  --accent: #0a6b5b;
  --accent-soft: #e2f0ec;
  --accent-fg: #ffffff;
  --rep: #b5423a;
  --dem: #2e5ca6;
  --lib: #7f6208;
  --ind: #5f6965;
  --yes: #1f5f7a;
  --no: #6a4c93;
  --shadow: 0 1px 2px rgba(17, 23, 21, .05), 0 4px 16px rgba(17, 23, 21, .05);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 8px;
  --r-md: 14px;
  --r-pill: 999px;
  --header-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110; --surface: #151b19; --raised: #19201e; --line: #26302d; --line-strong: #34403c; --control-line: #64716c;
    --fg: #e8eeeb; --muted: #a3afaa; --accent: #5fcfb4; --accent-soft: #15302a; --accent-fg: #06201a;
    --rep: #ef8b81; --dem: #8fb2f2; --lib: #e2c25e; --ind: #a7b1ad; --yes: #8cc9e6; --no: #c3a8ec;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1110; --surface: #151b19; --raised: #19201e; --line: #26302d; --line-strong: #34403c; --control-line: #64716c;
  --fg: #e8eeeb; --muted: #a3afaa; --accent: #5fcfb4; --accent-soft: #15302a; --accent-fg: #06201a;
  --rep: #ef8b81; --dem: #8fb2f2; --lib: #e2c25e; --ind: #a7b1ad; --yes: #8cc9e6; --no: #c3a8ec;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; scroll-padding-bottom: 24px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 1rem; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.nowrap { white-space: nowrap; }
[hidden] { display: none !important; }

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

.skip {
  position: fixed; z-index: 40; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 8px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r-sm); font-weight: 600; text-decoration: none;
  transform: translateY(-200%);
}
.skip:focus { transform: none; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; color: var(--fg); text-decoration: none; letter-spacing: -.01em; white-space: nowrap; }
.brand-mark { width: 22px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--fg); }
.nav { display: flex; gap: 2px; margin-left: auto; align-self: stretch; }
.nav a { position: relative; display: flex; align-items: center; color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500; padding: 0 12px; min-height: 44px; white-space: nowrap; }
.nav a:hover { color: var(--fg); }
.nav a[aria-current="page"] { color: var(--fg); font-weight: 600; }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.countdown { font-size: .84rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 6px 12px; border-radius: var(--r-pill); white-space: nowrap; font-variant-numeric: tabular-nums; }
.picks-btn {
  display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: .9rem; font-weight: 600; white-space: nowrap;
  background: var(--fg); color: var(--bg); border: 2px solid var(--fg); border-radius: var(--r-pill); padding: 6px 8px 6px 14px; min-height: 40px; cursor: pointer;
}
.picks-btn .n { background: var(--bg); color: var(--fg); border-radius: var(--r-pill); min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: .8rem; font-variant-numeric: tabular-nums; padding: 0 6px; }
@media (max-width: 68.75em) { .countdown { display: none; } }
@media (max-width: 53.75em) {
  .top .wrap { flex-wrap: wrap; row-gap: 0; padding-top: 8px; }
  .picks-btn { margin-left: auto; }
  /* sideways strips scroll sideways only: with overflow-y left auto, iOS lets a 1px overflow drag the text up and down */
  .nav { order: 3; flex-basis: 100%; margin: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; border-top: 1px solid var(--line); }
  .nav a[aria-current="page"]::after { bottom: 0; }
  .nav a:first-child { padding-left: 0; }
  .nav a:first-child[aria-current="page"]::after { left: 0; }
  .nav::-webkit-scrollbar { display: none; }
  .nav { padding-right: 28px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
  .nav:focus-within { -webkit-mask-image: none; mask-image: none; }
  .nav a { min-height: 46px; padding: 0 12px; }
}
@media (max-width: 23.75em) { .picks-btn .my { display: none; } .brand { font-size: .94rem; gap: 8px; } .top .wrap { gap: 8px; } }
/* Short windows, including desktop browsers zoomed to 300-400%: the header scrolls away
   instead of covering a third of the screen, and the tabs wrap instead of hiding off-screen */
@media (max-height: 30em) {
  .top { position: static; }
  .nav { flex-wrap: wrap; overflow: visible; padding-right: 0; -webkit-mask-image: none; mask-image: none; }
  .nav a { padding: 0 12px 0 0; min-height: 36px; }
  .nav a[aria-current="page"]::after { left: 0; right: 12px; }
  .top .wrap { min-height: 0; padding-block: 6px; }
}

/* Picks sheet */
.scrim { position: fixed; inset: 0; z-index: 24; background: rgba(0, 0, 0, .28); }
.sheet {
  position: fixed; z-index: 26;
  right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + 8px);
  width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - var(--header-h) - 40px); overflow: auto;
  background: var(--raised); border: 1px solid var(--control-line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 20px;
}
.sheet h2 { font-size: 1.06rem; font-weight: 700; }
.sheet .hint { font-size: .84rem; color: var(--muted); margin-top: 4px; }
.sheet ul { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 4px; }
.sheet li a { display: grid; gap: 1px; padding: 10px 12px; margin: 0 -12px; border-radius: var(--r-sm); text-decoration: none; color: var(--fg); }
.sheet li a:hover { background: var(--surface); }
.sheet li span { font-size: .8rem; color: var(--muted); }
.sheet li b { font-weight: 600; }
.sheet .empty { font-size: .9rem; color: var(--muted); padding: 6px 0; }
.sheet .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.linkbtn { font: inherit; font-size: .9rem; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 8px 0; min-height: 40px; }

/* Hero */
.hero { padding-block: 56px 32px; }
.eyebrow { font-size: .8125rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.5rem, 6.4vw, 4.25rem); line-height: 1.04; letter-spacing: -.02em; margin-top: 14px; max-width: 14ch; }
.lede { font-size: clamp(1.06rem, 2vw, 1.22rem); color: var(--muted); max-width: 60ch; margin-top: 18px; line-height: 1.5; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; font-size: .875rem; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.es { margin-top: 10px; font-size: .9rem; color: var(--muted); }

/* Find your ballot */
.find-ballot { margin-top: 32px; padding: 24px; border: 1px solid var(--control-line); border-radius: var(--r-md); background: var(--raised); box-shadow: var(--shadow); display: grid; gap: 8px; }
.find-ballot h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
.find-ballot > p { color: var(--muted); }
.fb-steps { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: fb; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px 28px; }
.fb-steps > li { counter-increment: fb; display: grid; gap: 6px; align-content: start; padding-left: 40px; position: relative; min-width: 0; }
.fb-steps > li::before { content: counter(fb); position: absolute; left: 0; top: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: .875rem; }
.fb-steps b { font-weight: 700; }
.fb-steps span { color: var(--muted); font-size: .9375rem; }
.fb-link { font-weight: 600; font-size: .9375rem; }
.fb-pickers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px 14px; margin-top: 4px; }
.fb-pickers label { display: grid; gap: 4px; font-size: .84rem; font-weight: 600; color: var(--muted); }
.fb-pickers select { font: inherit; font-size: .9375rem; color: var(--fg); background: var(--bg); border: 1px solid var(--control-line); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; width: 100%; }
.fb-status { font-size: .9375rem; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
.fb-status:empty { display: none; }
.fb-status a { font-weight: 600; }
.mine-note { margin-top: 14px; font-size: .9375rem; color: var(--fg); background: var(--accent-soft); border-radius: var(--r-sm); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.mine-note .linkbtn { padding: 0; min-height: 0; }

/* Where they differ */
.differ { margin-top: 18px; background: var(--surface); border-radius: var(--r-md); padding: 14px 18px; max-width: 100%; }
.differ-h { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.differ ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.differ li { font-size: .9375rem; color: var(--muted); line-height: 1.5; }
.differ li b { color: var(--fg); font-weight: 600; }

/* Absentee and ID boxes */
.callouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; margin-top: 18px; }
.callout { display: flex; gap: 16px; align-items: flex-start; padding: 18px 20px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--fg); text-decoration: none; min-width: 0; }
.callout .ic.id { border-radius: 4px; width: 30px; height: 22px; }

/* Public update log */
.updates-h { margin-top: 28px; }
.updates { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: .906rem; color: var(--muted); }
.updates b { color: var(--fg); font-weight: 600; }
.updates-more { margin-top: 8px; }
.updates-more summary { cursor: pointer; width: fit-content; color: var(--accent); font-weight: 600; font-size: .906rem; min-height: 24px; }
.updates-more .updates { margin-top: 8px; }
.callout:hover { text-decoration: none; filter: brightness(.98); }
.callout .ic { flex: none; width: 34px; height: 22px; border-radius: 50%; border: 2px solid var(--accent); margin-top: 2px; }
.callout .tx { display: grid; gap: 2px; min-width: 0; }
.callout .ct { font-weight: 700; font-size: 1.03rem; color: var(--fg); }
.callout .cb { color: var(--muted); font-size: .9375rem; }
.callout .cta { color: var(--accent); font-weight: 600; font-size: .9375rem; margin-top: 4px; }

.dates { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; margin-top: 24px; }
.date { background: var(--raised); padding: 16px 18px; display: grid; gap: 4px; align-content: start; min-width: 0; color: var(--fg); text-decoration: none; }
a.date:hover { background: var(--surface); }
.date .k { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.date .v { font-size: 1.06rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.date .s { font-size: .84rem; color: var(--muted); }
.date.past .v { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
@media (max-width: 53.75em) { .dates { grid-template-columns: repeat(2, minmax(0, 1fr)); } .date:last-child { grid-column: 1 / -1; } }
@media (max-width: 27.5em) { .dates { grid-template-columns: 1fr; } }

/* Issue filter */
.filter { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); }
.filter .wrap { display: grid; gap: 10px; padding-block: 12px; }
.filter-row { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
.filter-label { font-size: .84rem; font-weight: 600; color: var(--muted); white-space: nowrap; padding-top: 9px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip { font: inherit; font-size: .875rem; font-weight: 500; color: var(--fg); background: var(--raised); border: 1px solid var(--control-line); border-radius: var(--r-pill); padding: 7px 14px; min-height: 38px; cursor: pointer; white-space: nowrap; }
.chip:hover { background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.filter-status { font-size: .9rem; color: var(--fg); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; max-width: 90ch; }
.filter-status .tn { flex-basis: 100%; color: var(--muted); }
.filter-status:empty { display: none; }
.filter-status .linkbtn { padding: 0; min-height: 0; }
/* Phones and short screens: the filter scrolls away so reading space stays open */
@media (max-width: 47.5em), (max-height: 35em) {
  .filter { position: static; }
  .filter-row { flex-direction: column; gap: 8px; }
  .filter-label { padding-top: 0; }
  .chips { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; width: 100%; padding: 2px 32px 4px 2px; margin: -2px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
  .chips:focus-within { -webkit-mask-image: none; mask-image: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { min-height: 44px; }
}

/* Race index */
.index { padding-block: 36px 8px; }
.index h2 { font-size: .8125rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 10px; margin-top: 16px; }
.index-grid a { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); text-decoration: none; color: var(--fg); background: var(--raised); min-width: 0; }
.index-grid a:hover { border-color: var(--control-line); background: var(--surface); }
.index-grid a.util { background: var(--surface); }
.index-grid b { font-weight: 600; font-size: .97rem; }
.index-grid span { font-size: .84rem; color: var(--muted); }

/* Tab views */
.view > .group:first-child { padding-top: 40px; }
.view { padding-bottom: 8px; }

/* Group headers */
.group { padding-block: 56px 0; }
.group > .wrap > h1, .group > .wrap > h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.9rem, 4vw, 2.5rem); letter-spacing: -.015em; line-height: 1.1; }
.group-intro { color: var(--muted); max-width: 64ch; margin-top: 10px; font-size: 1.03rem; }
.group-src { margin-top: 10px; font-size: .84rem; color: var(--muted); max-width: 90ch; }

/* Race */
.race { margin-top: 36px; padding-top: 32px; border-top: 1px solid var(--line); }
.race-head { display: flex; gap: 12px 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.race-head > div { min-width: 0; flex: 1 1 420px; }
.race h3.office { font-size: 1.56rem; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; margin-top: 6px; }
.does { color: var(--muted); margin-top: 6px; max-width: 66ch; }
.status { font-size: .84rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 5px 12px; max-width: 100%; }
.cands { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; margin-top: 22px; }
a.law { color: inherit; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a.law:hover { color: var(--accent); text-decoration-style: solid; }
.law-tip { position: fixed; z-index: 35; max-width: min(320px, calc(100vw - 16px)); background: var(--fg); color: var(--bg); padding: 10px 12px; border-radius: var(--r-sm); font-size: .875rem; line-height: 1.45; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
.law-tip[hidden] { display: none; }
.law-tip .hint { display: block; margin-top: 4px; font-size: .8rem; opacity: .8; }
.laws-ref { border-bottom: 1px solid var(--line); }
.laws-ref .wrap { padding-bottom: 40px; }
.laws-intro { margin-top: 6px; max-width: 70ch; }
.laws-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 20px 28px; margin: 18px 0 0; }
.law-item { border-radius: 4px; }
.law-item:focus { outline: 3px solid var(--accent); outline-offset: 6px; }
.law-item dt { font-weight: 600; font-size: .9375rem; }
.law-item .kind { font-weight: 400; font-size: .8125rem; color: var(--muted); margin-left: 4px; }
.law-item dd { margin: 4px 0 0; font-size: .906rem; color: var(--muted); line-height: 1.5; }
.law-item .law-src { display: block; margin-top: 4px; font-size: .84rem; }
.race-foot { display: grid; gap: 6px; margin-top: 14px; max-width: 80ch; font-size: .875rem; color: var(--muted); }
.race-foot b { color: var(--fg); font-weight: 600; }
.ref-inline { font-size: .84rem; }

/* Candidate card */
.cand { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
.cand-top { display: flex; gap: 14px; align-items: flex-start; }
.cand-top .who { flex: 1; min-width: 0; }
.cand h4 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.party { display: inline-flex; align-items: center; gap: 7px; font-size: .875rem; font-weight: 600; margin-top: 4px; }
.party::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.party.R { color: var(--rep); } .party.D { color: var(--dem); } .party.L { color: var(--lib); } .party.I { color: var(--ind); }
