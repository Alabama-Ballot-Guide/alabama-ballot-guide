<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#ffffff;color:#111715;font-family:Figtree,system-ui,sans-serif}
  .card{box-sizing:border-box;width:1200px;height:630px;padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between;border-top:14px solid #0a6b5b}
  .brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px}
  .mark{width:44px;height:28px;border-radius:50%;border:4px solid #111715;position:relative;box-sizing:border-box}
  .mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#111715}
  h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:96px;line-height:1.02;letter-spacing:-.02em;margin:0}
  p{font-size:32px;color:#56625d;margin:18px 0 0;max-width:30ch;line-height:1.3}
  .foot{display:flex;gap:28px;font-size:24px;font-weight:600;color:#0a6b5b}
  .ovals{display:flex;gap:14px}.ovals span{width:46px;height:28px;border-radius:50%;border:3px solid #111715}
  .ovals span.on{background:#111715}
  .row{display:flex;justify-content:space-between;align-items:flex-end}
</style></head><body><div class="card">
  <div class="brand"><span class="mark"></span>Alabama Ballot Guide</div>
  <div><h1>Know who’s on your ballot.</h1><p>Nonpartisan, sourced summaries for Alabama’s Nov. 3, 2026 election.</p></div>
  <div class="row"><div class="foot"><span>Every race</span><span>4 amendments</span><span>How to vote</span></div>
  <div class="ovals"><span></span><span class="on"></span><span></span></div></div>
</div></body></html>
