# Required status check for every pull request into main (agent or human).
# Read-only token, no secrets. Agent PRs are judged by the rules on main, so a PR cannot loosen its own checks.
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AGENT_LOGIN: alabama-guide-agent[bot]   # login of the GitHub App the AI pipeline uses
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      # the daily research task opens PRs under the editor's account from agent/* branches;
      # those get agent rules too (stricter only: a branch name can't loosen anything)
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SITE_URL: https://alabamaballotguide.org   # keep in step with deploy.yml
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Load the rules from main
        run: |
          R="$RUNNER_TEMP/main"; mkdir -p "$R"
          IS_AGENT=false
          if [ "$PR_AUTHOR" = "$AGENT_LOGIN" ] || [[ "$HEAD_REF" == agent/* ]]; then IS_AGENT=true; fi
          echo "IS_AGENT=$IS_AGENT" >> "$GITHUB_ENV"
          git show "$BASE_SHA:data.js" > "$R/base-data.js"
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          for f in scripts/validate-data.js security/source-domains.json security/facts.lock.json; do
            if ! git show "$BASE_SHA:$f" > "$R/$(basename "$f")" 2>/dev/null; then
              # first PR that adds the checks: only a human PR may bootstrap them
              [ "$IS_AGENT" = false ] || { echo "::error::$f missing on main"; exit 1; }
              cp "$f" "$R/$(basename "$f")"
            fi
          done

      - name: Validate data.js (parsed as JSON, never executed)
        run: |
          R="$RUNNER_TEMP/main"
          if [ "$IS_AGENT" = true ]; then
            # agents: rules from main, and only data.js may change
            ARGS=(--agent --allowlist "$R/source-domains.json" --lock "$R/facts.lock.json")
          else
            # humans: the PR's own allowlist/lock, which CODEOWNERS makes a human review, and a larger
            # change budget so an editor can approve a full correction pass in one PR
            ARGS=(--max-changes 600 --allowlist security/source-domains.json --lock security/facts.lock.json)
          fi
          node "$R/validate-data.js" --base "$R/base-data.js" --new data.js \
            --changed-files "$RUNNER_TEMP/changed.txt" "${ARGS[@]}" | tee "$RUNNER_TEMP/validate.txt"
          { echo "## Data check (author: $PR_AUTHOR, agent rules: $IS_AGENT)"; echo '```'; cat "$RUNNER_TEMP/validate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned build tools
        run: npm ci --ignore-scripts

      - name: Build a preview
        run: python3 -I build.py

      - name: Check the built pages
        run: |
          node "$RUNNER_TEMP/main/validate-data.js" --dist dist --allowlist security/source-domains.json \
            --lock security/facts.lock.json --site-host "$(echo "$SITE_URL" | cut -d/ -f3)"

      - name: Upload the preview for the human reviewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7
